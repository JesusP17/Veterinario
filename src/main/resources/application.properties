# Nombre de la aplicación
spring.application.name=demo

# Puerto del servidor web
server.port=8080

# =======================================================
# CONFIGURACIÓN DE CONEXIÓN A MYSQL (XAMPP)
# =======================================================
# URL de conexión: XAMPP usa por defecto el puerto 3306
# createDatabaseIfNotExist=true creará la BD 'demo_db' automáticamente si aún no existe
spring.datasource.url=jdbc:mysql://localhost:3306/demo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# Credenciales por defecto de XAMPP:
# Usuario: root
# Contraseña: vacía (sin contraseña)
spring.datasource.username=root
spring.datasource.password=

# Driver JDBC de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =======================================================
# update: actualiza o crea las tablas en la BD automáticamente a partir de las entidades @Entity
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
